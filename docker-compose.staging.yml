# Staging environment, brought up by the Deploy stage.
# Identical image to production, different configuration only.
services:
  taskflow-staging:
    image: ${IMAGE_NAME:-taskflow-api}:${IMAGE_TAG:-latest}
    container_name: taskflow-staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      JWT_SECRET: ${STAGING_JWT_SECRET:-staging-secret-value-at-least-32-chars-long}
      LOG_LEVEL: debug
      DATABASE_FILE: /app/data/taskflow.db
    ports:
      - '${STAGING_PORT:-3001}:3000'
    volumes:
      - staging-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  staging-data:
