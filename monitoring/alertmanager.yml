global:
  resolve_timeout: 5m

route:
  receiver: team-notifications
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    # Critical alerts page immediately instead of waiting for the group window.
    - matchers:
        - severity = "critical"
      receiver: team-notifications
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: team-notifications
    # Replace the URL with a real Slack or Teams incoming webhook to deliver
    # alerts to the team channel.
    webhook_configs:
      - url: 'http://host.docker.internal:5001/alerts'
        send_resolved: true

inhibit_rules:
  # While the instance is down, suppress the noisier symptom alerts.
  - source_matchers:
      - alertname = "TaskFlowInstanceDown"
    target_matchers:
      - severity = "warning"
    equal: ['job']
