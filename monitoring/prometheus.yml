global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # The production application exposes /metrics via prom-client.
  - job_name: taskflow-prod
    metrics_path: /metrics
    static_configs:
      - targets: ['taskflow-prod:3000']
        labels:
          environment: production

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
