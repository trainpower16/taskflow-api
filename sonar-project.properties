# SonarQube configuration for the Code Quality stage.
sonar.projectKey=taskflow-api
sonar.projectName=TaskFlow API
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Reports produced by the Test and Code Quality stages are imported so Sonar
# reports coverage and lint findings alongside its own analysis.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint-report.json
sonar.testExecutionReportPaths=reports/sonar-test-report.xml

# Generated and vendored files are excluded so they cannot distort the
# duplication and maintainability ratings.
sonar.exclusions=node_modules/**,coverage/**,reports/**,data/**,scripts/**
sonar.coverage.exclusions=tests/**,scripts/**,src/server.js,eslint.config.js
sonar.cpd.exclusions=tests/**
