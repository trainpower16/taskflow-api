# Production environment plus its monitoring stack, brought up by the Release
# and Monitoring stages. The application image is the exact artefact that was
# already verified in staging — it is promoted by tag, never rebuilt.
services:
  taskflow-prod:
    image: ${IMAGE_NAME:-taskflow-api}:${IMAGE_TAG:-latest}
    container_name: taskflow-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_NUMBER: ${BUILD_NUMBER:-local}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      JWT_SECRET: ${PROD_JWT_SECRET:-production-secret-value-at-least-32-chars}
      LOG_LEVEL: info
      DATABASE_FILE: /app/data/taskflow.db
    ports:
      - '${PROD_PORT:-3002}:3000'
    volumes:
      - prod-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taskflow-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - taskflow-prod

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taskflow-alertmanager
    restart: unless-stopped
    ports:
      - '${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  prod-data:
  prometheus-data:
